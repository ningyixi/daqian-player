<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大前玩家">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1a">
<meta name="format-detection" content="telephone=no">
<title>大前玩家</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a1a;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: none;
  }
  #game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a1a;
  }
  canvas {
    display: block;
    width: 100%; height: 100%;
    max-width: 480px;
    background: transparent;
  }
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    z-index: 10;
    background: linear-gradient(160deg, #0d0d2b 0%, #1a0a2e 40%, #0a1a2e 100%);
    transition: opacity 0.25s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }
  .logo {
    font-size: clamp(2.2rem, 10vw, 3.2rem);
    font-weight: 800;
    letter-spacing: 0.08em;
    background: linear-gradient(135deg, #ff6b9d, #c44dff, #4d9fff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.4rem;
    text-shadow: none;
    filter: drop-shadow(0 0 20px rgba(196, 77, 255, 0.5));
  }
  .tagline {
    color: rgba(255,255,255,0.55);
    font-size: 0.95rem;
    margin-bottom: 2.5rem;
    letter-spacing: 0.15em;
  }
  .btn {
    appearance: none; border: none;
    padding: 1rem 2.8rem;
    font-size: 1.15rem; font-weight: 700;
    font-family: inherit;
    color: #fff;
    border-radius: 999px;
    cursor: pointer;
    background: linear-gradient(135deg, #ff4d8a, #a855f7);
    box-shadow: 0 8px 32px rgba(168, 85, 247, 0.45), 0 0 0 1px rgba(255,255,255,0.1) inset;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.94); box-shadow: 0 4px 16px rgba(168, 85, 247, 0.35); }
  .btn-secondary {
    background: linear-gradient(135deg, #334155, #475569);
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    margin-top: 0.9rem;
    font-size: 0.95rem; font-weight: 600;
    padding: 0.75rem 2rem;
  }
  .score-big {
    font-size: clamp(3rem, 14vw, 4.5rem);
    font-weight: 800;
    color: #fff;
    margin: 0.6rem 0 0.2rem;
    font-variant-numeric: tabular-nums;
  }
  .score-label { color: rgba(255,255,255,0.5); font-size: 0.9rem; letter-spacing: 0.1em; }
  .high-score {
    color: #fbbf24;
    font-size: 1rem;
    margin: 0.8rem 0 2rem;
    font-weight: 600;
  }
  .hud {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 12px);
    left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 16px;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .hud.visible { opacity: 1; }
  .hud-score {
    font-size: 1.4rem; font-weight: 700; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    font-variant-numeric: tabular-nums;
  }
  .hud-hi {
    font-size: 0.85rem; color: rgba(255,255,255,0.6);
    text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .hint {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 28px);
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .hint.visible { opacity: 1; }
  .avatar-preview {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 800; color: #fff;
    margin-bottom: 1.2rem;
    box-shadow: 0 0 24px rgba(96, 165, 250, 0.5);
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c"></canvas>
</div>

<div id="hud" class="hud">
  <div>
    <div class="hud-score" id="hudScore">0</div>
    <div class="hud-hi" id="hudHi">最高 0</div>
  </div>
</div>
<div id="hint" class="hint">← 点左边　点右边 →</div>

<div id="startScreen" class="screen">
  <div class="avatar-preview">前</div>
  <div class="logo">大前玩家</div>
  <div class="tagline">左右闪避 · 活得越久越好</div>
  <button class="btn" id="btnStart">开始游戏</button>
</div>

<div id="overScreen" class="screen hidden">
  <div class="score-label">本局得分</div>
  <div class="score-big" id="finalScore">0</div>
  <div class="high-score" id="finalHi">最高纪录 0</div>
  <button class="btn" id="btnRetry">再来一局</button>
</div>

<script>
(function () {
  'use strict';

  const HS_KEY = 'daqian_player_highscore';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const hud = document.getElementById('hud');
  const hint = document.getElementById('hint');
  const hudScore = document.getElementById('hudScore');
  const hudHi = document.getElementById('hudHi');
  const finalScore = document.getElementById('finalScore');
  const finalHi = document.getElementById('finalHi');

  let W = 0, H = 0, dpr = 1;
  let state = 'start'; // start | playing | over
  let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10) || 0;
  hudHi.textContent = '最高 ' + highScore;

  // Player
  const player = {
    x: 0, y: 0, r: 22,
    vx: 0, targetDir: 0,
    speed: 420,
    pulse: 0
  };

  // Obstacles
  let obstacles = [];
  let spawnTimer = 0;
  let spawnInterval = 0.9;
  let gameTime = 0;
  let score = 0;
  let particles = [];
  let tapFlash = null; // {x, y, t}
  let shake = 0;
  let bgStars = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
    if (state !== 'playing') {
      player.x = W / 2;
      player.y = H * 0.72;
    }
  }

  function initStars() {
    bgStars = [];
    const n = Math.floor((W * H) / 12000);
    for (let i = 0; i < n; i++) {
      bgStars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: 0.5 + Math.random() * 1.8,
        a: 0.15 + Math.random() * 0.45,
        sp: 8 + Math.random() * 30
      });
    }
  }

  function resetGame() {
    obstacles = [];
    particles = [];
    spawnTimer = 0.4;
    spawnInterval = 0.95;
    gameTime = 0;
    score = 0;
    player.x = W / 2;
    player.y = H * 0.72;
    player.vx = 0;
    player.targetDir = 0;
    player.pulse = 0;
    shake = 0;
    tapFlash = null;
    hudScore.textContent = '0';
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    hud.classList.add('visible');
    hint.classList.add('visible');
    setTimeout(function () { hint.classList.remove('visible'); }, 2800);
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  }

  function gameOver() {
    state = 'over';
    shake = 14;
    spawnBurst(player.x, player.y, '#ff6b9d', 18);
    if (score > highScore) {
      highScore = score;
      localStorage.setItem(HS_KEY, String(highScore));
    }
    finalScore.textContent = String(score);
    finalHi.textContent = '最高纪录 ' + highScore;
    hudHi.textContent = '最高 ' + highScore;
    hud.classList.remove('visible');
    hint.classList.remove('visible');
    setTimeout(function () {
      overScreen.classList.remove('hidden');
    }, 380);
    try { if (navigator.vibrate) navigator.vibrate([30, 40, 30]); } catch (e) {}
  }

  function spawnObstacle() {
    const kinds = ['block', 'block', 'diamond', 'wide'];
    const kind = kinds[(Math.random() * kinds.length) | 0];
    let w, h, color;
    if (kind === 'wide') {
      w = 70 + Math.random() * 50;
      h = 18 + Math.random() * 10;
      color = '#f472b6';
    } else if (kind === 'diamond') {
      w = 28 + Math.random() * 16;
      h = w;
      color = '#a78bfa';
    } else {
      w = 36 + Math.random() * 28;
      h = 36 + Math.random() * 28;
      color = '#60a5fa';
    }
    const margin = 16;
    const x = margin + Math.random() * (W - w - margin * 2);
    const baseSpeed = 160 + gameTime * 12;
    const speed = Math.min(baseSpeed, 520) + Math.random() * 40;
    obstacles.push({
      x: x, y: -h - 10, w: w, h: h,
      vy: speed, kind: kind, color: color,
      rot: Math.random() * Math.PI, rotSp: (Math.random() - 0.5) * 3
    });
  }

  function spawnBurst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 180;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 0.4 + Math.random() * 0.5,
        max: 0.9,
        r: 2 + Math.random() * 4,
        color: color
      });
    }
  }

  function hitTest(ox, oy, ow, oh) {
    // circle vs AABB (expanded slightly)
    const cx = player.x, cy = player.y, cr = player.r * 0.72;
    const nx = Math.max(ox, Math.min(cx, ox + ow));
    const ny = Math.max(oy, Math.min(cy, oy + oh));
    const dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < cr * cr;
  }

  function onPointer(clientX, clientY, isDown) {
    if (state !== 'playing') return;
    if (!isDown) {
      player.targetDir = 0;
      return;
    }
    const mid = W / 2;
    player.targetDir = clientX < mid ? -1 : 1;
    tapFlash = { x: clientX, y: clientY, t: 0.28 };
    player.pulse = 1;
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
  }

  // Touch
  let activeTouchId = null;
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (state !== 'playing') return;
    const t = e.changedTouches[0];
    activeTouchId = t.identifier;
    onPointer(t.clientX, t.clientY, true);
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (state !== 'playing' || activeTouchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === activeTouchId) {
        onPointer(t.clientX, t.clientY, true);
        break;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === activeTouchId) {
        activeTouchId = null;
        player.targetDir = 0;
        break;
      }
    }
  }, { passive: false });

  canvas.addEventListener('touchcancel', function () {
    activeTouchId = null;
    player.targetDir = 0;
  });

  // Mouse (desktop test)
  let mouseDown = false;
  canvas.addEventListener('mousedown', function (e) {
    mouseDown = true;
    onPointer(e.clientX, e.clientY, true);
  });
  window.addEventListener('mousemove', function (e) {
    if (mouseDown) onPointer(e.clientX, e.clientY, true);
  });
  window.addEventListener('mouseup', function () {
    mouseDown = false;
    player.targetDir = 0;
  });

  // Prevent pull-to-refresh / bounce
  document.addEventListener('touchmove', function (e) {
    if (e.target === canvas || state === 'playing') e.preventDefault();
  }, { passive: false });

  document.getElementById('btnStart').addEventListener('click', function (e) {
    e.preventDefault();
    startGame();
  });
  document.getElementById('btnRetry').addEventListener('click', function (e) {
    e.preventDefault();
    startGame();
  });

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    // stars scroll always
    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      s.y += s.sp * dt * (state === 'playing' ? 1.2 : 0.4);
      if (s.y > H + 4) { s.y = -4; s.x = Math.random() * W; }
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 40);

    if (tapFlash) {
      tapFlash.t -= dt;
      if (tapFlash.t <= 0) tapFlash = null;
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (state !== 'playing') return;

    gameTime += dt;
    score = Math.floor(gameTime * 10);
    hudScore.textContent = String(score);

    // difficulty ramp
    spawnInterval = Math.max(0.38, 0.95 - gameTime * 0.018);

    // player move
    const accel = 2800;
    const targetVx = player.targetDir * player.speed;
    if (player.vx < targetVx) player.vx = Math.min(targetVx, player.vx + accel * dt);
    else if (player.vx > targetVx) player.vx = Math.max(targetVx, player.vx - accel * dt);
    // friction when no input
    if (player.targetDir === 0) {
      player.vx *= Math.pow(0.02, dt);
      if (Math.abs(player.vx) < 4) player.vx = 0;
    }
    player.x += player.vx * dt;
    const pad = player.r + 4;
    if (player.x < pad) { player.x = pad; player.vx = 0; }
    if (player.x > W - pad) { player.x = W - pad; player.vx = 0; }
    player.pulse = Math.max(0, player.pulse - dt * 4);

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      // occasional double spawn later
      if (gameTime > 12 && Math.random() < 0.28) spawnObstacle();
      spawnTimer = spawnInterval * (0.75 + Math.random() * 0.5);
    }

    // obstacles
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.vy * dt;
      o.rot += o.rotSp * dt;
      if (o.y > H + 40) {
        obstacles.splice(i, 1);
        continue;
      }
      if (hitTest(o.x, o.y, o.w, o.h)) {
        gameOver();
        return;
      }
    }
  }

  function drawBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0620');
    g.addColorStop(0.5, '#120a28');
    g.addColorStop(1, '#0a1528');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < bgStars.length; i++) {
      const s = bgStars[i];
      ctx.globalAlpha = s.a;
      ctx.fillStyle = '#c4b5fd';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // subtle lane divider
    if (state === 'playing') {
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(W / 2, 0);
      ctx.lineTo(W / 2, H);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  function drawPlayer() {
    const r = player.r * (1 + player.pulse * 0.12);
    // glow
    const glow = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, r * 2.2);
    glow.addColorStop(0, 'rgba(96,165,250,0.45)');
    glow.addColorStop(1, 'rgba(96,165,250,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // body
    const body = ctx.createLinearGradient(player.x - r, player.y - r, player.x + r, player.y + r);
    body.addColorStop(0, '#93c5fd');
    body.addColorStop(1, '#7c3aed');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r, 0, Math.PI * 2);
    ctx.fill();

    // inner ring
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x, player.y, r * 0.78, 0, Math.PI * 2);
    ctx.stroke();

    // label 「前」
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(r * 0.95) + 'px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('前', player.x, player.y + 1);
  }

  function roundRect(x, y, w, h, rad) {
    const r = Math.min(rad, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawObstacles() {
    for (let i = 0; i < obstacles.length; i++) {
      const o = obstacles[i];
      ctx.save();
      ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
      if (o.kind === 'diamond') ctx.rotate(Math.PI / 4 + o.rot * 0.15);
      else ctx.rotate(o.rot * 0.08);

      // shadow glow
      ctx.shadowColor = o.color;
      ctx.shadowBlur = 16;
      ctx.fillStyle = o.color;
      const hw = o.w / 2, hh = o.h / 2;
      if (o.kind === 'diamond') {
        roundRect(-hw * 0.7, -hh * 0.7, o.w * 0.7, o.h * 0.7, 4);
        ctx.fill();
      } else {
        roundRect(-hw, -hh, o.w, o.h, 8);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // highlight
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      if (o.kind === 'diamond') {
        roundRect(-hw * 0.7, -hh * 0.7, o.w * 0.7, o.h * 0.28, 3);
      } else {
        roundRect(-hw + 3, -hh + 3, o.w - 6, o.h * 0.28, 4);
      }
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawTapFlash() {
    if (!tapFlash) return;
    const t = tapFlash.t / 0.28;
    ctx.globalAlpha = t * 0.35;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(tapFlash.x, tapFlash.y, 28 + (1 - t) * 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBg();
    if (state === 'playing' || state === 'over') {
      drawObstacles();
      drawPlayer();
      drawParticles();
      drawTapFlash();
    } else {
      // idle preview player on start (behind UI)
      player.x = W / 2;
      player.y = H * 0.62;
      // don't draw under start overlay much — skip
    }
    ctx.restore();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 100); });

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
